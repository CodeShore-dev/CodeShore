name: PR check

# 這是工廠的「硬層」關卡。在這之前，PR 上沒有任何機器檢查：四個 workflow 全是
# push:[main] 或 workflow_dispatch，所以 `nx test` / `ptr:format:check` 只在
# orca-issue-work 的 Step 5 叫 worker 自己跑時才生效——worker 跳過、或自稱跑過了，
# 沒有東西會發現。
#
# 刻意只接「在乾淨的 main 上已經是綠的」兩個檢查：
#   - ptr:format:check（只檢改動檔，見 scripts/format-changed.mjs）
#   - check-boundaries.mjs（只數 @nx/enforce-module-boundaries，main 上是 0）
#   - check-tests.mjs（跑 nx affected -t test，但判準是「今天綠的不准變紅」，
#     基準線在 scripts/test-baseline.json——直接當關卡會是假關卡，4/9 在 main 上就紅）
#
# 刻意不接 `nx lint`：main 上有 62 個既有 error，接上來永遠紅，又是一個假關卡。
# 判準見 .kiro/steering/tech.md 的「已知落差」。lint 要先收斂到 0 才能進這裡。
on:
  pull_request:
    branches: [main]

env:
  # 這個 repo 的 crawler 帶 puppeteer / rebrowser-puppeteer。PR 檢查不跑爬蟲，
  # 跳過 Chrome 下載省掉大半安裝時間。
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  # scripts/format-changed.mjs 預設拿本機的 `main` 當基準。CI 上 checkout 之後
  # 本機沒有 main 這個 branch，只有 remote-tracking ref，所以明確指過去。
  FORMAT_BASE: origin/main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # nx affected 與 format-changed.mjs 都要比到 main 的共同祖先，
          # 淺 clone 會比不到。
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.7.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (changed files only)
        run: pnpm ptr:format:check

      # 架構層的關卡。只數 @nx/enforce-module-boundaries，不看 eslint 的 exit code——
      # main 上有 62 個既有 error 會讓它永遠非零。boundary 違規在 main 上是 0，
      # 所以它符合「只接已經綠的檢查」。
      - name: Project boundaries
        run: node scripts/check-boundaries.mjs

      # 判準是「今天綠的專案不准變紅」，不是「全綠」。9 個帶 test target 的專案裡有 4 個
      # 在乾淨的 main 上就紅，基準線記在 scripts/test-baseline.json。
      # 直接跑 `nx affected -t test` 會是假關卡（CI run 37115122838 證過）。
      - name: Test (no new failures)
        run: node scripts/check-tests.mjs
